x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 10s

x-api-depends-on: &api-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:15-alpine
    container_name: llm-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_platform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-llm_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm_platform}"]
      <<: *healthcheck-defaults
      interval: 10s
      retries: 8
    networks:
      - llm-platform-net
    logging: *default-logging

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: llm-platform-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      <<: *healthcheck-defaults
    networks:
      - llm-platform-net
    logging: *default-logging

  # --- RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: llm-platform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-llm_platform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      <<: *healthcheck-defaults
      interval: 10s
      retries: 8
    networks:
      - llm-platform-net
    logging: *default-logging

  # --- Application (backend API) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-platform-api
    container_name: llm-platform-api
    restart: unless-stopped
    depends_on:
      <<: *api-depends-on
    environment:
      - LLM_PLATFORM_ENV=${LLM_PLATFORM_ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-llm_platform}:${POSTGRES_PASSWORD:-llm_platform_secret}@postgres:5432/${POSTGRES_DB:-llm_platform}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-llm_platform}:${POSTGRES_PASSWORD:-llm_platform_secret}@postgres:5432/${POSTGRES_DB:-llm_platform}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-llm_platform}:${RABBITMQ_PASSWORD:-rabbitmq_secret}@rabbitmq:5672/%2F
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-llm-platform}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HF_HOME=/app/cache/huggingface
      - HF_HUB_OFFLINE=1
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./tests:/app/tests:ro
      - app_uploads:/app/uploads
      - app_cache:/app/cache
      # Mount the host HuggingFace cache so embedding models (bge-small-zh / bge-m3)
      # are loaded from the host instead of re-downloaded inside the container.
      - ${HF_HOME:-~/.cache/huggingface}:/app/cache/huggingface:ro
    networks:
      - llm-platform-net
    logging: *default-logging

  # --- Celery Worker ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-platform-worker
    container_name: llm-platform-worker
    restart: unless-stopped
    depends_on:
      <<: *api-depends-on
    environment:
      - LLM_PLATFORM_ENV=${LLM_PLATFORM_ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-llm_platform}:${POSTGRES_PASSWORD:-llm_platform_secret}@postgres:5432/${POSTGRES_DB:-llm_platform}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-llm_platform}:${RABBITMQ_PASSWORD:-rabbitmq_secret}@rabbitmq:5672/%2F
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - app_uploads:/app/uploads
      - app_cache:/app/cache
    command: celery -A src.infrastructure.broker:celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=100
    # Worker 不监听 HTTP 端口，不能用 Dockerfile 里 curl localhost:8000 的检查；
    # 改用 celery inspect ping（经 broker 探活 worker 是否响应）。
    healthcheck:
      test: ["CMD", "celery", "-A", "src.infrastructure.broker:celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - llm-platform-net
    logging: *default-logging

  # --- Frontend (React SPA) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: llm-platform-frontend
    container_name: llm-platform-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:80"
    networks:
      - llm-platform-net
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  app_uploads:
  app_cache:

networks:
  llm-platform-net:
    driver: bridge
