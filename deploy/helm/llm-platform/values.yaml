# LLM Platform Helm Values
# Default values for production deployment

# Global settings
global:
  environment: production
  imageRegistry: docker.io
  imagePullSecrets: []

# API Server configuration
api:
  enabled: true
  replicas: 3
  image:
    repository: llm-platform
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

# Worker configuration
worker:
  enabled: true
  replicas: 2
  image:
    repository: llm-platform-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

# Application configuration
config:
  logLevel: INFO
  logJson: true
  corsOrigins: "*"
  otelServiceName: llm-platform
  dbPoolSize: 20
  dbMaxOverflow: 10
  redisPoolSize: 50
  rateLimitDefaultRPM: 100
  rateLimitDefaultTPM: 100000
  circuitBreakerTimeoutSeconds: 30
  circuitBreakerFailureThreshold: 5
  ragDefaultTopK: 10
  ragCacheTtlSeconds: 3600
  agentMaxStepsDefault: 15
  agentLoopDetectionThreshold: 3
  maxFileUploadSizeMB: 50
  metricsEnabled: true
  tracingEnabled: true

# Secrets (use external secrets manager in production)
secrets:
  databaseUrl: ""
  redisUrl: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  googleApiKey: ""
  encryptionKey: ""
  jwtSecret: ""

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.llm-platform.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: llm-platform-tls
      hosts:
        - api.llm-platform.example.com

# Monitoring
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
  grafana:
    enabled: true
    dashboards:
      enabled: true
      label: grafana_dashboard

# Alerting
alerting:
  enabled: true
  prometheusRule:
    enabled: true
    namespace: monitoring
  slack:
    webhookUrl: ""
  pagerduty:
    routingKey: ""

# External dependencies
postgresql:
  enabled: true
  auth:
    username: llm
    password: llm
    database: llm_platform
  primary:
    persistence:
      size: 50Gi

redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      size: 10Gi

# Service accounts
serviceAccount:
  api:
    create: true
    name: llm-platform
    annotations: {}
  worker:
    create: true
    name: llm-platform-worker
    annotations: {}

# Network policies
networkPolicy:
  enabled: false

# Pod disruption budget
podDisruptionBudget:
  api:
    enabled: true
    minAvailable: 2
  worker:
    enabled: true
    minAvailable: 1
