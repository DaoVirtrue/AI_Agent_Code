# ─── Alembic Configuration ────────────────────────────────────
# Database migration configuration for LLM Platform.
# Uses async PostgreSQL with SQLAlchemy 2.0.

[alembic]
# Path to migration scripts
script_location = alembic

# SQLAlchemy connection URL (synchronous for Alembic)
# In production, override with DATABASE_URL_SYNC env var
sqlalchemy.url = postgresql://llm_platform:llm_platform_secret@localhost:5432/llm_platform

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
