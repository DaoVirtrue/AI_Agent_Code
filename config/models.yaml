# ─── LLM Platform: Model Registry ────────────────────────────
# Each model entry defines its capabilities, pricing, and constraints.
# Pricing is per 1M tokens (input / output).

models:
  # ─── OpenAI Models ──────────────────────────────────────────
  gpt-4o:
    provider: "openai"
    model_id: "gpt-4o"
    display_name: "GPT-4o"
    description: "OpenAI's flagship multimodal model with 128K context window"
    context_window: 128000
    max_output_tokens: 16384
    pricing:
      input: 2.50
      output: 10.00
      cached_input: 1.25
    capabilities:
      - "chat"
      - "function_calling"
      - "vision"
      - "code_generation"
      - "translation"
      - "summarization"
      - "reasoning"
      - "structured_output"
    supports_streaming: true
    supports_caching: true
    supports_vision: true
    supports_function_calling: true
    supports_parallel_tool_calls: true
    rate_limit:
      requests_per_minute: 500
      tokens_per_minute: 150000
    default_temperature: 0.7
    default_top_p: 1.0
    supported_languages:
      - "en"  # primary
      - "zh"
      - "ja"
      - "ko"
      - "fr"
      - "de"
      - "es"
      - "pt"
      - "ar"
      - "ru"
    knowledge_cutoff: "2024-10"
    max_images_per_request: 20

